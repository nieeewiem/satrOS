- name: "Jądro systemu (Kernel)"
  description: "Wybierz jądro systemu (wymagane)"
  type: "radio"
  hidden: false
  selected: true
  packages:
    - name: "Linux (Standardowe)"
      packages: [ linux, linux-headers ]
    - name: "Linux LTS (Długoterminowe wsparcie)"
      packages: [ linux-lts, linux-lts-headers ]
    - name: "Linux Zen (Zoptymalizowane pod wydajność/gry)"
      packages: [ linux-zen, linux-zen-headers ]

- name: "Środowisko graficzne"
  description: "Wybierz jeden lub więcej pulpitów"
  type: "checkbox"
  hidden: false
  packages:
    - name: "KDE Plasma"
      packages: [ plasma-desktop, sddm ]
    - name: "GNOME"
      packages: [ gnome, gdm ]
    - name: "Hyprland"
      packages: [ hyprland, waybar ]
    - name: "i3wm (goły)"
      packages: [ i3-wm ]
    - name: "i3wm (z autorskim configiem)"
      packages: [ i3-wm, polybar, rofi ]

- name: "Przeglądarki internetowe"
  type: "checkbox"
  hidden: false
  packages:
    - name: "Firefox"
      packages: [ firefox ]
    - name: "Chromium"
      packages: [ chromium ]

- name: "Sterowniki NVIDIA"
  type: "checkbox"
  hidden: false
  packages:
